<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI GitHub Dev</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background: #0d1117;
            color: #c9d1d9;
        }
        h1 { color: #58a6ff; margin-bottom: 24px; }
        label { color: #8b949e; font-size: 14px; display: block; margin-bottom: 6px; }
        select, textarea, input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            background: #161b22;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 6px;
            font-size: 15px;
        }
        textarea { resize: vertical; }
        .btn-row { display: flex; gap: 10px; margin-bottom: 16px; }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }
        #micBtn    { background: #238636; color: white; flex: 1; }
        #micBtn.recording { background: #da3633; }
        #submitBtn { background: #1f6feb; color: white; flex: 1; }
        #loginBtn  { background: #238636; color: white; width: 100%; padding: 12px; }
        #status {
            margin-top: 16px;
            padding: 12px;
            background: #161b22;
            border-radius: 6px;
            min-height: 48px;
            line-height: 1.6;
        }
        #streamLog {
            margin-top: 10px;
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            font-size: 13px;
            font-family: monospace;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }
        .log-line { padding: 3px 0; border-bottom: 1px solid #21262d; color: #8b949e; }
        .log-line.success { color: #3fb950; }
        .log-line.error   { color: #f85149; }
        .log-line.info    { color: #58a6ff; }
        .log-line.warning { color: #d29922; }

        /* Approval Panel */
        #approvalPanel {
            display: none;
            margin-top: 16px;
            padding: 16px;
            background: #161b22;
            border: 2px solid #d29922;
            border-radius: 8px;
        }
        #approvalPanel h3 {
            color: #d29922;
            margin-bottom: 8px;
            font-size: 16px;
        }
        #approvalSummary {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 12px;
        }
        #approvalDetails {
            background: #0d1117;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            font-family: monospace;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 12px;
            color: #c9d1d9;
        }
        .approval-item {
            padding: 4px 0;
            border-bottom: 1px solid #21262d;
        }
        .approval-item:last-child { border-bottom: none; }
        .tag-create  { color: #3fb950; }
        .tag-modify  { color: #d29922; }
        .tag-delete  { color: #f85149; }
        .approval-btns { display: flex; gap: 8px; flex-wrap: wrap; }
        #approveBtn {
            background: #238636;
            color: white;
            flex: 1;
        }
        #rejectBtn {
            background: #da3633;
            color: white;
            flex: 1;
        }
        #modifyBtn {
            background: #9e6a03;
            color: white;
            flex: 1;
        }
        #feedbackSection { display: none; margin-top: 12px; }
        #feedbackInput {
            width: 100%;
            padding: 8px;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 8px;
        }
        #sendFeedbackBtn {
            background: #1f6feb;
            color: white;
            width: 100%;
        }

        #loginSection { text-align: center; padding: 40px 0; }
        #appSection { display: none; }
        .repo-info { font-size: 12px; color: #8b949e; margin-top: -12px; margin-bottom: 16px; }
        a { color: #58a6ff; }
        .progress-bar { height: 4px; background: #21262d; border-radius: 2px; margin-top: 10px; display: none; }
        .progress-fill { height: 100%; background: #1f6feb; border-radius: 2px; transition: width 0.3s ease; }
    </style>
</head>
<body>
    <h1>AI GitHub Dev</h1>

    <div id="loginSection">
        <p style="color:#8b949e; margin-bottom:20px;">
            Login with GitHub to start modifying your repos with AI
        </p>
        <button id="loginBtn" onclick="window.location.href='/auth/github/login'">
            Login with GitHub
        </button>
    </div>

    <div id="appSection">
        <p id="welcomeMsg" style="color:#8b949e; margin-bottom:20px;"></p>

        <label>Select Repository</label>
        <select id="repoSelect" onchange="onRepoSelected()">
            <option value="">-- Loading your repos... --</option>
        </select>
        <div class="repo-info" id="repoInfo"></div>

        <label>What do you want to build?</label>
        <textarea id="intentText" rows="3"
            placeholder="e.g. Add an attendance tracker feature">
        </textarea>

        <div class="btn-row">
            <button id="micBtn" onclick="toggleVoice()">Speak</button>
            <button id="submitBtn" onclick="runAgent()">Run Agent</button>
        </div>

        <div id="status">Status: Ready</div>
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill" style="width:0%"></div>
        </div>

        <!-- Approval Panel -->
        <div id="approvalPanel">
            <h3 id="approvalTitle">Waiting for approval...</h3>
            <p id="approvalSummary"></p>
            <div id="approvalDetails"></div>
            <div class="approval-btns">
                <button id="approveBtn" onclick="submitApproval('approved')">Approve</button>
                <button id="rejectBtn"  onclick="submitApproval('rejected')">Reject</button>
                <button id="modifyBtn"  onclick="showFeedback()">Request Changes</button>
            </div>
            <div id="feedbackSection">
                <input type="text" id="feedbackInput" placeholder="Describe what changes you want..." />
                <button id="sendFeedbackBtn" onclick="submitApproval('modified')">Send Feedback</button>
            </div>
        </div>

        <div id="streamLog"></div>
    </div>

    <script>
        let token        = localStorage.getItem("jwt_token") || "";
        let recognition  = null;
        let isRecording  = false;
        let selectedRepo = null;
        let eventSource  = null;
        let currentSessionId = null;
        let currentGate      = null;

        const PROGRESS = {
            "agent_started":       5,
            "planner_started":     10,
            "planner_completed":   20,
            "retrieval_started":   25,
            "retrieval_cloning":   30,
            "retrieval_indexing":  40,
            "retrieval_searching": 50,
            "retrieval_completed": 55,
            "context_started":     60,
            "context_completed":   65,
            "codegen_started":     70,
            "codegen_completed":   82,
            "validator_started":   85,
            "validator_completed": 88,
            "decision_commit":     90,
            "commit_started":      92,
            "commit_writing":      94,
            "commit_pushing":      97,
            "pr_created":          99,
            "agent_completed":     100
        };

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get("token")) {
                token = urlParams.get("token");
                localStorage.setItem("jwt_token", token);
                window.history.replaceState({}, "", "/");
            }
            if (token) {
                document.getElementById("loginSection").style.display = "none";
                document.getElementById("appSection").style.display   = "block";
                await loadRepos();
            }
        }

        async function loadRepos() {
            try {
                document.getElementById("status").textContent = "Loading repositories...";
                const response = await fetch("/repos/list", {
                    headers: { "Authorization": "Bearer " + token }
                });
                if (response.status === 401) { logout(); return; }
                const data = await response.json();
                document.getElementById("welcomeMsg").textContent =
                    "Welcome " + data.username + " — " + data.count + " repos found";
                const select = document.getElementById("repoSelect");
                select.innerHTML = '<option value="">-- Select a repository --</option>';
                data.repos.forEach(repo => {
                    const option       = document.createElement("option");
                    option.value       = JSON.stringify(repo);
                    option.textContent = repo.full_name + (repo.private ? " (private)" : "");
                    select.appendChild(option);
                });
                document.getElementById("status").textContent = "Status: Ready";
            } catch (err) {
                document.getElementById("status").textContent = "Error: " + err.message;
            }
        }

        function onRepoSelected() {
            const select = document.getElementById("repoSelect");
            if (!select.value) return;
            selectedRepo = JSON.parse(select.value);
            document.getElementById("repoInfo").textContent =
                "Branch: " + selectedRepo.default_branch +
                (selectedRepo.description ? " | " + selectedRepo.description : "");
        }

        function toggleVoice() {
            if (!("webkitSpeechRecognition" in window) && !("SpeechRecognition" in window)) {
                alert("Use Chrome or Edge for voice input.");
                return;
            }
            if (isRecording) { recognition.stop(); return; }
            const SR    = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SR();
            recognition.lang       = "en-US";
            recognition.continuous = false;
            recognition.onstart = () => {
                isRecording = true;
                document.getElementById("micBtn").textContent = "Recording...";
                document.getElementById("micBtn").classList.add("recording");
            };
            recognition.onresult = (e) => {
                document.getElementById("intentText").value = e.results[0][0].transcript;
                document.getElementById("status").textContent = "Got voice input!";
            };
            recognition.onend = () => {
                isRecording = false;
                document.getElementById("micBtn").textContent = "Speak";
                document.getElementById("micBtn").classList.remove("recording");
            };
            recognition.start();
        }

        async function runAgent() {
            if (!selectedRepo) { alert("Please select a repository."); return; }
            const userIntent = document.getElementById("intentText").value.trim();
            if (!userIntent) { alert("Please describe what you want to build."); return; }

            document.getElementById("status").textContent      = "Starting agent...";
            document.getElementById("streamLog").innerHTML     = "";
            document.getElementById("streamLog").style.display = "block";
            document.getElementById("progressBar").style.display = "block";
            document.getElementById("approvalPanel").style.display = "none";
            document.getElementById("submitBtn").disabled      = true;
            setProgress(0);

            try {
                const response = await fetch("/agent/run", {
                    method:  "POST",
                    headers: {
                        "Content-Type":  "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify({
                        repo_url:    selectedRepo.clone_url,
                        user_intent: userIntent
                    })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || "Failed");

                currentSessionId = data.session_id;
                connectStream(data.session_id);

            } catch (err) {
                document.getElementById("status").textContent = "Error: " + err.message;
                document.getElementById("submitBtn").disabled = false;
            }
        }

        function connectStream(sessionId) {
            if (eventSource) eventSource.close();
            const url = `/agent/stream/${sessionId}?token=${token}`;
            eventSource = new EventSource(url);
            eventSource.onmessage = (e) => {
                const event = JSON.parse(e.data);
                handleEvent(event);
            };
            eventSource.onerror = () => {
                eventSource.close();
                document.getElementById("submitBtn").disabled = false;
            };
        }

        function handleEvent(event) {
            const type    = event.event_type;
            const message = event.message;
            const data    = event.data || {};

            if (PROGRESS[type] !== undefined) setProgress(PROGRESS[type]);
            document.getElementById("status").textContent = message;
            addLog(type, message, data);

            // ── Approval needed ──────────────────────────
            if (type === "approval_needed") {
                currentGate = data.gate;
                showApprovalPanel(data);
                return;
            }

            // ── Approval received ─────────────────────────
            if (type === "approval_received") {
                hideApprovalPanel();
                addLog("info", `Decision: ${data.status} for ${data.gate}`, {});
                return;
            }

            // ── Completion ────────────────────────────────
            if (type === "agent_completed") {
                eventSource.close();
                document.getElementById("submitBtn").disabled = false;
                setProgress(100);
                if (data.pr_url) {
                    document.getElementById("status").innerHTML =
                        "Done! PR: <a href='" + data.pr_url + "' target='_blank'>" + data.pr_url + "</a>";
                }
            }

            if (type === "agent_failed") {
                eventSource.close();
                document.getElementById("submitBtn").disabled = false;
                hideApprovalPanel();
                document.getElementById("status").textContent = "Failed: " + message;
            }

            if (type === "planner_completed" && data.steps) {
                addLog("info", "Plan: " + data.steps.join(" -> "), {});
            }

            if (type === "codegen_completed" && data.files) {
                addLog("info", "Files: " + data.files.join(", "), {});
            }
        }

        function showApprovalPanel(data) {
            document.getElementById("approvalPanel").style.display = "block";
            document.getElementById("approvalTitle").textContent   = data.title;
            document.getElementById("approvalSummary").textContent = data.summary;
            document.getElementById("feedbackSection").style.display = "none";
            document.getElementById("feedbackInput").value = "";

            // Build details HTML
            const details  = data.details || {};
            const detailEl = document.getElementById("approvalDetails");
            detailEl.innerHTML = "";

            if (details.steps) {
                details.steps.forEach((step, i) => {
                    const div = document.createElement("div");
                    div.className   = "approval-item";
                    div.textContent = `${i + 1}. ${step}`;
                    detailEl.appendChild(div);
                });
            }

            if (details.files) {
                details.files.forEach(file => {
                    const div      = document.createElement("div");
                    div.className  = "approval-item";
                    const tag      = file.action || file.action_type || "create";
                    const tagClass = tag === "create" ? "tag-create" :
                                     tag === "modify" ? "tag-modify" : "tag-delete";
                    div.innerHTML  = `<span class="${tagClass}">[${tag}]</span> ${file.file} (${file.lines || 0} lines)`;
                    detailEl.appendChild(div);
                });
            }

            if (details.branch) {
                const div = document.createElement("div");
                div.className   = "approval-item";
                div.textContent = `Branch: ${details.branch}`;
                detailEl.appendChild(div);
            }

            if (details.commit_message) {
                const div = document.createElement("div");
                div.className   = "approval-item";
                div.textContent = `Commit: ${details.commit_message.split("\n")[0]}`;
                detailEl.appendChild(div);
            }

            document.getElementById("status").textContent = "Waiting for your approval...";
            addLog("warning", `Approval needed: ${data.title}`, {});
        }

        function hideApprovalPanel() {
            document.getElementById("approvalPanel").style.display = "none";
            currentGate = null;
        }

        function showFeedback() {
            document.getElementById("feedbackSection").style.display = "block";
            document.getElementById("feedbackInput").focus();
        }

        async function submitApproval(status) {
            if (!currentSessionId || !currentGate) return;

            const feedback = status === "modified"
                ? document.getElementById("feedbackInput").value.trim()
                : "";

            if (status === "modified" && !feedback) {
                alert("Please describe what changes you want.");
                return;
            }

            try {
                await fetch(`/approval/${currentSessionId}/${currentGate}/respond`, {
                    method:  "POST",
                    headers: {
                        "Content-Type":  "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify({ status, feedback })
                });

                addLog(
                    status === "approved" ? "success" : "warning",
                    `You ${status} the ${currentGate} gate`,
                    {}
                );

                hideApprovalPanel();

            } catch (err) {
                alert("Failed to submit approval: " + err.message);
            }
        }

        function addLog(type, message, data) {
            const log  = document.getElementById("streamLog");
            const line = document.createElement("div");
            line.className = "log-line";

            const prefix = {
                "agent_started":      ">>",
                "planner_started":    "  Planner:",
                "planner_completed":  "  Planner:",
                "retrieval_started":  "  Retrieval:",
                "retrieval_cloning":  "  Retrieval:",
                "retrieval_indexing": "  Retrieval:",
                "retrieval_searching":"  Retrieval:",
                "retrieval_completed":"  Retrieval:",
                "context_started":    "  Context:",
                "context_completed":  "  Context:",
                "codegen_started":    "  CodeGen:",
                "codegen_completed":  "  CodeGen:",
                "validator_started":  "  Validator:",
                "validator_completed":"  Validator:",
                "decision_commit":    "  Decision:",
                "commit_started":     "  Commit:",
                "commit_writing":     "  Commit:",
                "commit_pushing":     "  Commit:",
                "pr_created":         "  PR:",
                "agent_completed":    ">> Done:",
                "agent_failed":       ">> Error:",
                "approval_needed":    ">> Approval:",
                "approval_received":  ">> Decision:",
                "info":               "  Info:",
                "warning":            "  Notice:",
                "success":            "  OK:"
            };

            if (type === "agent_completed" || type === "pr_created" || type === "success") {
                line.classList.add("success");
            } else if (type === "agent_failed") {
                line.classList.add("error");
            } else if (type === "info" || type === "approval_needed") {
                line.classList.add("info");
            } else if (type === "warning" || type === "approval_received") {
                line.classList.add("warning");
            }

            line.textContent = (prefix[type] || "  ") + " " + message;
            log.appendChild(line);
            log.scrollTop = log.scrollHeight;
        }

        function setProgress(pct) {
            document.getElementById("progressFill").style.width = pct + "%";
        }

        function logout() {
            localStorage.removeItem("jwt_token");
            token = "";
            document.getElementById("loginSection").style.display = "block";
            document.getElementById("appSection").style.display   = "none";
        }

        init();
    </script>
</body>
</html>
