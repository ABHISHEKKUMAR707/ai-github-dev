<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI GitHub Dev</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background: #0d1117;
            color: #c9d1d9;
        }
        h1 { color: #58a6ff; margin-bottom: 24px; }
        label { color: #8b949e; font-size: 14px; display: block; margin-bottom: 6px; }
        select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            background: #161b22;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 6px;
            font-size: 15px;
        }
        textarea { resize: vertical; }
        .btn-row { display: flex; gap: 10px; margin-bottom: 16px; }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }
        #micBtn    { background: #238636; color: white; flex: 1; }
        #micBtn.recording { background: #da3633; }
        #submitBtn { background: #1f6feb; color: white; flex: 1; }
        #loginBtn  { background: #238636; color: white; width: 100%; padding: 12px; }
        #status {
            margin-top: 16px;
            padding: 12px;
            background: #161b22;
            border-radius: 6px;
            min-height: 48px;
            line-height: 1.6;
        }
        #logs {
            margin-top: 10px;
            padding: 10px;
            background: #0d1117;
            border-radius: 6px;
            font-size: 12px;
            color: #8b949e;
            display: none;
        }
        #loginSection { text-align: center; padding: 40px 0; }
        #appSection { display: none; }
        .repo-info { font-size: 12px; color: #8b949e; margin-top: -12px; margin-bottom: 16px; }
        a { color: #58a6ff; }
    </style>
</head>
<body>
    <h1>🤖 AI GitHub Dev</h1>

    <div id="loginSection">
        <p style="color:#8b949e; margin-bottom:20px;">
            Login with GitHub to start modifying your repos with AI
        </p>
        <button id="loginBtn" onclick="window.location.href='/auth/github/login'">
            Login with GitHub
        </button>
    </div>

    <div id="appSection">
        <p id="welcomeMsg" style="color:#8b949e; margin-bottom:20px;"></p>

        <label>Select Repository</label>
        <select id="repoSelect" onchange="onRepoSelected()">
            <option value="">-- Loading your repos... --</option>
        </select>
        <div class="repo-info" id="repoInfo"></div>

        <label>What do you want to build?</label>
        <textarea id="intentText" rows="3"
            placeholder="e.g. Add an attendance tracker feature">
        </textarea>

        <div class="btn-row">
            <button id="micBtn" onclick="toggleVoice()">🎤 Hold to Speak</button>
            <button id="submitBtn" onclick="runAgent()">🚀 Run Agent</button>
        </div>

        <div id="status">Status: Ready</div>
        <div id="logs"></div>
    </div>

    <script>
        let token        = localStorage.getItem("jwt_token") || "";
        let recognition  = null;
        let isRecording  = false;
        let selectedRepo = null;

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get("token")) {
                token = urlParams.get("token");
                localStorage.setItem("jwt_token", token);
                window.history.replaceState({}, "", "/");
            }

            if (token) {
                document.getElementById("loginSection").style.display = "none";
                document.getElementById("appSection").style.display   = "block";
                await loadRepos();
            }
        }

        async function loadRepos() {
            try:
                document.getElementById("status").textContent = "Loading repositories...";
                const response = await fetch("/repos/list", {
                    headers: { "Authorization": "Bearer " + token }
                });

                if (response.status === 401) { logout(); return; }

                const data = await response.json();
                document.getElementById("welcomeMsg").textContent =
                    "Welcome " + data.username + " — " + data.count + " repos found";

                const select = document.getElementById("repoSelect");
                select.innerHTML = '<option value="">-- Select a repository --</option>';
                data.repos.forEach(repo => {
                    const option       = document.createElement("option");
                    option.value       = JSON.stringify(repo);
                    option.textContent = repo.full_name + (repo.private ? " 🔒" : "");
                    select.appendChild(option);
                });

                document.getElementById("status").textContent = "Status: Ready";
            } catch (err) {
                document.getElementById("status").textContent = "Error: " + err.message;
            }
        }

        function onRepoSelected() {
            const select = document.getElementById("repoSelect");
            if (!select.value) return;
            selectedRepo = JSON.parse(select.value);
            document.getElementById("repoInfo").textContent =
                "Branch: " + selectedRepo.default_branch +
                (selectedRepo.description ? " | " + selectedRepo.description : "");
        }

        function toggleVoice() {
            if (!("webkitSpeechRecognition" in window) && !("SpeechRecognition" in window)) {
                alert("Use Chrome or Edge for voice input.");
                return;
            }
            if (isRecording) { recognition.stop(); return; }

            const SR    = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SR();
            recognition.lang       = "en-US";
            recognition.continuous = false;

            recognition.onstart = () => {
                isRecording = true;
                document.getElementById("micBtn").textContent = "🔴 Recording...";
                document.getElementById("micBtn").classList.add("recording");
                document.getElementById("status").textContent = "Listening...";
            };
            recognition.onresult = (e) => {
                document.getElementById("intentText").value = e.results[0][0].transcript;
                document.getElementById("status").textContent = "Got voice input!";
            };
            recognition.onend = () => {
                isRecording = false;
                document.getElementById("micBtn").textContent = "🎤 Hold to Speak";
                document.getElementById("micBtn").classList.remove("recording");
            };
            recognition.start();
        }

        async function runAgent() {
            if (!selectedRepo) { alert("Please select a repository."); return; }
            const userIntent = document.getElementById("intentText").value.trim();
            if (!userIntent) { alert("Please describe what you want to build."); return; }

            document.getElementById("status").textContent  = "⏳ Starting agent...";
            document.getElementById("logs").style.display  = "none";
            document.getElementById("submitBtn").disabled  = true;

            try {
                const response = await fetch("/agent/run", {
                    method:  "POST",
                    headers: {
                        "Content-Type":  "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify({
                        repo_url:    selectedRepo.clone_url,
                        user_intent: userIntent
                    })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || "Failed");

                document.getElementById("status").textContent = "⏳ Agent running...";
                pollStatus(data.task_id);

            } catch (err) {
                document.getElementById("status").textContent  = "❌ Error: " + err.message;
                document.getElementById("submitBtn").disabled  = false;
            }
        }

        function pollStatus(taskId) {
            const interval = setInterval(async () => {
                try {
                    const response = await fetch("/agent/status/" + taskId, {
                        headers: { "Authorization": "Bearer " + token }
                    });
                    const data = await response.json();

                    if (data.status === "done") {
                        clearInterval(interval);
                        document.getElementById("submitBtn").disabled = false;

                        const result = data.result;

                        // ── FIX: Check inner status ──────────────
                        if (result && result.status === "failed") {
                            document.getElementById("status").textContent =
                                "❌ Agent failed: " + (result.error_message || "Unknown error");
                            showLogs(result.logs || []);
                            return;
                        }

                        const prUrl = result?.pr_url;
                        if (prUrl) {
                            document.getElementById("status").innerHTML =
                                "✅ Done! PR: <a href='" + prUrl + "' target='_blank'>" + prUrl + "</a>";
                        } else {
                            document.getElementById("status").textContent =
                                "⚠️ Agent completed but no PR was created. Check logs below.";
                        }
                        showLogs(result?.logs || []);

                    } else if (data.status === "failed") {
                        clearInterval(interval);
                        document.getElementById("submitBtn").disabled = false;
                        document.getElementById("status").textContent =
                            "❌ Task failed: " + JSON.stringify(data.error);

                    } else {
                        document.getElementById("status").textContent =
                            "⏳ Status: " + data.status + "...";
                    }
                } catch (err) {
                    clearInterval(interval);
                    document.getElementById("submitBtn").disabled = false;
                }
            }, 5000);
        }

        function showLogs(logs) {
            if (!logs.length) return;
            const logsDiv = document.getElementById("logs");
            logsDiv.style.display = "block";
            logsDiv.innerHTML     = "<strong>Agent Steps:</strong><br>" +
                logs.map(l => "• " + l).join("<br>");
        }

        function logout() {
            localStorage.removeItem("jwt_token");
            token = "";
            document.getElementById("loginSection").style.display = "block";
            document.getElementById("appSection").style.display   = "none";
        }

        init();
    </script>
</body>
</html>
